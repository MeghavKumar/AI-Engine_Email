services:
  postgres:
    image: postgres:16
    container_name: ai-email-engine-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: email_engine
      POSTGRES_PASSWORD: email_engine
      POSTGRES_DB: email_engine
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
