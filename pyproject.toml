[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-email-engine"
version = "0.1.0"
description = "Reusable AI email automation engine"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "langgraph>=0.2",
    "httpx>=0.27",
    "apscheduler>=3.10,<4",
    "email-validator>=2.2"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.6"
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
